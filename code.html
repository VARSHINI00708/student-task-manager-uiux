<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        .wireframe-box {
            position: relative;
            border: 1px solid #BDBDBD;
        }
        
        .wireframe-box::before, .wireframe-box::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .wireframe-box-x::before {
            background: linear-gradient(to top right, transparent calc(50% - 0.5px), #BDBDBD 50%, transparent calc(50% + 0.5px));
        }
        
        .wireframe-box-x::after {
            background: linear-gradient(to bottom right, transparent calc(50% - 0.5px), #BDBDBD 50%, transparent calc(50% + 0.5px));

<body class="min-h-screen flex flex-col text-on-surface">
<!-- Top App Bar -->

<button class="flex items-center justify-center w-10 h-10 transition-colors duration-200 hover:bg-surface-container-low">

</button>
<h1 class="font-headline-sm text-headline-sm-mobile md:text-headline-sm text-primary">Task Details</h1>
</div>
<button class="px-md py-xs border border-outline font-label-md text-label-md transition-colors duration-200 hover:bg-surface-container-low">
            Edit
        </button>
</header>
<!-- Main Canvas -->
<main class="flex-grow w-full max-w-4xl mx-auto px-margin-mobile md:px-margin-desktop py-lg space-y-lg">
<!-- Header Section -->
<section class="space-y-sm">
<div class="flex items-center gap-sm">
<span class="px-sm py-1 border border-outline-variant font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant">HIST 202</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Due Oct 24, 2023</span>
</div>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary">Research Bibliography</h2>
</section>
<!-- Visual Placeholder (Architectural Brutalism style) -->
<div class="wireframe-box wireframe-box-x aspect-video md:aspect-[21/9] w-full bg-surface-container-low"></div>
<!-- Progress / Sub-tasks -->
<section class="space-y-md">
<div class="flex items-center justify-between border-b border-outline-variant pb-base">
<h3 class="font-headline-sm text-headline-sm text-primary">Sub-tasks</h3>
<span class="font-label-md text-label-md text-on-surface-variant">2 of 4 complete</span>
</div>
<div class="space-y-sm">
<!-- Sub-task Item -->
<label class="flex items-center gap-md p-md border border-outline-variant hover:bg-surface-container-low transition-colors cursor-pointer">
<input checked="" class="w-5 h-5 border-2 border-primary text-primary focus:ring-0 rounded-none" type="checkbox"/>
<span class="flex-grow font-body-md text-body-md line-through text-on-surface-variant">Find 5 sources</span>
<span class="material-symbols-outlined text-on-surface-variant">drag_indicator</span>
</label>
<label class="flex items-center gap-md p-md border border-outline-variant hover:bg-surface-container-low transition-colors cursor-pointer">
<input checked="" class="w-5 h-5 border-2 border-primary text-primary focus:ring-0 rounded-none" type="checkbox"/>
<span class="flex-grow font-body-md text-body-md line-through text-on-surface-variant">Format citations</span>
<span class="material-symbols-outlined text-on-surface-variant">drag_indicator</span>
</label>
<label class="flex items-center gap-md p-md border border-outline-variant hover:bg-surface-container-low transition-colors cursor-pointer">
<input class="w-5 h-5 border-2 border-primary text-primary focus:ring-0 rounded-none" type="checkbox"/>
<span class="flex-grow font-body-md text-body-md">Draft annotations</span>

<label class="flex items-center gap-md p-md border border-outline-variant hover:bg-surface-container-low transition-colors cursor-pointer">

<button class="w-full py-md border border-dashed border-outline text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-low transition-colors">

<footer class="fixed bottom-0 left-0 w-full h-20 bg-surface-lowest border-t border-outline-variant px-margin-mobile md:px-margin-desktop flex items-center justify-center z-50">
<div class="max-w-4xl w-full flex gap-md">
<button class="flex-1 py-md border-2 border-primary font-label-md text-label-md font-bold text-primary hover:bg-surface-container-low transition-colors active:scale-95">
                Mark as Done
            </button>
<button class="p-md border border-outline-variant hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant">delete</span>
</button>
</div>
</footer>
<script>
        // Simple micro-interaction for checkboxes
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const labelText = this.nextElementSibling;
                if (this.checked) {
                    labelText.classList.add('line-through', 'text-on-surface-variant');
                } else {
                    labelText.classList.remove('line-through', 'text-on-surface-variant');
                }
            });
        });

        // Handle Mark as Done button visual feedback
        const doneBtn = document.querySelector('button.font-bold');
        doneBtn.addEventListener('click', () => {
            if (doneBtn.innerText === 'Mark as Done') {
                doneBtn.innerText = 'Completed';
                doneBtn.classList.replace('text-primary', 'text-on-surface-variant');
                doneBtn.classList.replace('border-primary', 'border-outline-variant');
            } else {
                doneBtn.innerText = 'Mark as Done';
                doneBtn.classList.replace('text-on-surface-variant', 'text-primary');
                doneBtn.classList.replace('border-outline-variant', 'border-primary');
            }
        });
    </script>
